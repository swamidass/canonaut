[workspace]
members = ["bindings/python"]
default-members = ["."]
resolver = "3"

[package]
name = "canonaut"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust port of nauty — graph automorphism groups and canonical labelings"
repository = "https://github.com/um-univie/canonaut"

[features]
# Compiles benches/c_nauty_helper.c and links the system libnauty so the
# Criterion benchmarks can compare against the C reference implementation.
# Requires nauty >= 2.8 headers/library under /usr/local.
c-nauty-bench = []

[dependencies]
rand = "0.9.2"


[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = "0.8.1"

[[bench]]
name = "bench"
harness = false
required-features = ["c-nauty-bench"]

[profile.release]
lto=true
codegen-units=1
strip=true

[profile.flamegraph]
inherits = "release"
debug = true
strip = false
