[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "canonaut"
version = "1.0.0"
description = "Graph canonicalization and automorphism groups: a safe Rust port of nauty"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["graph", "canonicalization", "automorphism", "isomorphism", "nauty"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/um-univie/canonaut"
Repository = "https://github.com/um-univie/canonaut"
Documentation = "https://docs.rs/canonaut"
Changelog = "https://github.com/um-univie/canonaut/blob/master/CHANGELOG.md"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "canonaut._canonaut"
python-source = "python"
